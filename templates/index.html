<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GLEM ai твой персональный друг и помощник!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0d0f14; color: #f1f5f9; display: flex; justify-content: center; height: 100vh; }
    .app { width: 100%; max-width: 780px; display: flex; flex-direction: column; background: #13161f; border-inline: 1px solid #232838; }
    header { padding: 16px 20px; background: #181c27; border-bottom: 1px solid #232838; display: flex; justify-content: space-between; align-items: center; }
    .dot { width: 9px; height: 9px; background: #10b981; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #10b981; }
    .chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; animation: pop .25s ease; position: relative; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .user { align-self: flex-end; background: #6366f1; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #1e2332; border: 1px solid #2c3347; padding-bottom: 30px; border-bottom-left-radius: 4px; }
    .copy { position: absolute; right: 10px; bottom: 6px; font-size: 11px; color: #94a3b8; background: none; border: none; cursor: pointer; }
    .copy:hover { color: #fff; }
    .bottom { padding: 14px 20px; background: #181c27; border-top: 1px solid #232838; }
    .chips { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .chip, .clear { background: #222736; color: #cbd5e1; border: 1px solid #30374d; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: .2s; }
    .chip:hover, .clear:hover { background: #2e354a; transform: translateY(-2px); color: #fff; }
    .chip:active, .clear:active, #send:active { transform: scale(0.95); }
    .row { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #30374d; background: #0d0f14; color: #fff; font-size: 15px; outline: none; transition: .2s; }
    input:focus { border-color: #6366f1; box-shadow: 0 0 12px rgba(99,102,241,.3); }
    #send { padding: 0 20px; border-radius: 12px; border: none; background: #6366f1; color: #fff; font-weight: 600; cursor: pointer; transition: .2s; }
    #send:hover:not(:disabled) { background: #4f46e5; transform: translateY(-2px); box-shadow: 0 4px 14px rgba(99,102,241,.4); }
    #send:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><span class="dot"></span><b>Джарвис AI</b></div>
      <button class="clear" onclick="chat.innerHTML=''">Очистить</button>
    </header>
    <div class="chat" id="chat">
      <div class="msg bot">Салют, бро! Я на связи. Пиши вопрос ⚡</div>
    </div>
    <div class="bottom">
      <div class="chips">
        <button class="chip" onclick="tip('Объясни простыми словами: ')">💡 Объясни просто</button>
        <button class="chip" onclick="tip('Напиши код для: ')">💻 Напиши код</button>
        <button class="chip" onclick="tip('Придумай 5 идей для: ')">🚀 5 идей</button>
      </div>
      <div class="row">
        <input id="inp" placeholder="Напиши сообщение..." autocomplete="off">
        <button id="send" onclick="send()">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat'), inp = document.getElementById('inp'), btn = document.getElementById('send');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    function tip(t) { inp.value = t; inp.focus(); }
    function add(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      if (cls === 'bot') {
        const c = document.createElement('button');
        c.className = 'copy'; c.textContent = 'Копировать';
        c.onclick = () => { navigator.clipboard.writeText(text); c.textContent = 'Готово ✓'; setTimeout(() => c.textContent = 'Копировать', 1500); };
        d.appendChild(c);
      }
      chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
    }
    async function send() {
      const text = inp.value.trim(); if (!text || btn.disabled) return;
      add(text, 'user'); inp.value = ''; btn.disabled = true;
      const wait = add('Думаю... ⏳', 'bot');
      try {
        const r = await fetch('/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: text}) });
        const data = await r.json(); wait.remove(); add(data.reply, 'bot');
      } catch { wait.remove(); add('❌ Ошибка сервера', 'bot'); }
      btn.disabled = false; inp.focus();
    }
  </script>
</body>
</html>
